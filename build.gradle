plugins {
    id 'java'
    id 'maven-publish'
}

group = 'com.cubk'
version = 'snapshot'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.3'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    withSourcesJar()
}

def testJavaVersion = providers.gradleProperty('testJavaVersion').orElse('8')
def embeddedClasses = layout.buildDirectory.dir('classes/sourceEmbedding')

test {
    useJUnitPlatform()
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(testJavaVersion.get().toInteger())
    }
}

tasks.register('compileSourceEmbeddingExample', JavaCompile) {
    group = 'verification'
    description = 'Compiles the raw EventManager sources with the zero-dependency embedding example.'
    source = files(
            fileTree('src/main/java') {
                include '**/*.java'
            },
            file('examples/source-embedding/EmbeddedUsage.java')
    )
    classpath = files()
    destinationDirectory = embeddedClasses
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(8)
    }
    sourceCompatibility = '8'
    targetCompatibility = '8'
    options.encoding = 'UTF-8'
}

tasks.register('runSourceEmbeddingExample', JavaExec) {
    group = 'verification'
    description = 'Runs the source-embedding example on the selected test JVM.'
    dependsOn 'compileSourceEmbeddingExample'
    classpath = files(embeddedClasses)
    mainClass = 'example.EmbeddedUsage'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(testJavaVersion.get().toInteger())
    }
}

check.dependsOn 'runSourceEmbeddingExample'

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}

wrapper {
    gradleVersion = '9.6.0'
    distributionType = Wrapper.DistributionType.BIN
}

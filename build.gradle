plugins {
    id 'java'
    id 'maven-publish'
}

group = 'dev.hotaru'
version = 'snapshot'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.3'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:unchecked', '-Xlint:deprecation'])
}

javadoc {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    if (JavaVersion.current().isJava8Compatible()) {
        options.addStringOption('Xdoclint:none', '-quiet')
    }
}

def testJavaVersion = providers.gradleProperty('testJavaVersion').orElse('8')

test {
    useJUnitPlatform()
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(testJavaVersion.get().toInteger())
    }
}

jar {
    manifest {
        attributes(
            'Automatic-Module-Name': 'dev.hotaru.event',
            'Implementation-Title': 'EventManager',
            'Implementation-Version': project.version
        )
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}

wrapper {
    gradleVersion = '9.6.0'
    distributionType = Wrapper.DistributionType.BIN
}

plugins {
    id 'java'
    id 'maven-publish'
}

group = 'dev.hotaru'
version = '0.1.0'

repositories {
    mavenCentral()
}

sourceSets {
    jmh {
        java.srcDirs = ['src/jmh/java']
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    jcstress {
        java.srcDirs = ['src/jcstress/java']
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.3'
    jmhImplementation 'org.openjdk.jmh:jmh-core:1.37'
    jmhAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
    jmhImplementation 'com.google.guava:guava:33.2.1-jre'
    jcstressImplementation 'org.openjdk.jcstress:jcstress-core:0.16'
    jcstressAnnotationProcessor 'org.openjdk.jcstress:jcstress-core:0.16'
}

// jcstress requires JDK 11+ to run; compile and execute its source set on 17.
compileJcstressJava {
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(17) }
    options.compilerArgs += ['-Xlint:-options']
}

tasks.register('jcstressRun', JavaExec) {
    group = 'verification'
    description = 'Runs jcstress concurrency tests (quick mode by default).'
    dependsOn compileJcstressJava
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    classpath = sourceSets.jcstress.runtimeClasspath
    mainClass = 'org.openjdk.jcstress.Main'
    jvmArgs = ['-Xms256m', '-Xmx1g', '-XX:+UseSerialGC']
    if (project.hasProperty('jcstressArgs')) {
        args project.property('jcstressArgs').toString().split('\\s+')
    } else {
        // Quick-profile equivalent: 1 iteration per test, 1 fork, capped CPUs.
        // "-af none" avoids taskset-based CPU pinning, which is unavailable on Windows.
        args = ['-c', '2', '-f', '1', '-iters', '1', '-time', '200', '-af', 'NONE']
    }
}

tasks.register('jmhRun', JavaExec) {
    group = 'benchmark'
    description = 'Runs JMH benchmarks. Usage: ./gradlew jmhRun -PjmhArgs="DispatchBenchmark.* -f 1 -wi 3 -i 5"'
    classpath = sourceSets.jmh.runtimeClasspath
    mainClass = 'org.openjdk.jmh.Main'
    jvmArgs = ['-Xms256m', '-Xmx1g']
    if (project.hasProperty('jmhArgs')) {
        args project.property('jmhArgs').toString().split('\\s+')
    } else {
        args = ['-prof', 'gc']
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:unchecked', '-Xlint:deprecation'])
}

javadoc {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    if (JavaVersion.current().isJava8Compatible()) {
        options.addStringOption('Xdoclint:none', '-quiet')
    }
}

def testJavaVersion = providers.gradleProperty('testJavaVersion').orElse('8')

test {
    useJUnitPlatform()
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(testJavaVersion.get().toInteger())
    }
}

jar {
    manifest {
        attributes(
            'Automatic-Module-Name': 'dev.hotaru.event',
            'Implementation-Title': 'EventManager',
            'Implementation-Version': project.version
        )
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}

wrapper {
    gradleVersion = '9.6.0'
    distributionType = Wrapper.DistributionType.BIN
}
